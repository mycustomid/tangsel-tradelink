<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081426"/>
      <stop offset="45%" stop-color="#0d2342"/>
      <stop offset="100%" stop-color="#050d1a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="80%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#F5D77F"/>
    </linearGradient>
    <linearGradient id="redFlagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E52D27"/>
      <stop offset="100%" stop-color="#B31217"/>
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#AA771C" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#D4AF37" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F5D77F" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="meshGlow" cx="85%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#1E4E8C" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#081426" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background scene -->
  <rect width="1200" height="750" fill="#030811"/>
  <circle cx="950" cy="180" r="450" fill="url(#meshGlow)"/>

  <!-- Subtle Guilloche Arc Patterns -->
  <g stroke="#D4AF37" stroke-opacity="0.08" fill="none" stroke-width="1.2">
    <circle cx="1100" cy="650" r="380"/>
    <circle cx="1100" cy="650" r="320"/>
    <circle cx="1100" cy="650" r="260"/>
    <circle cx="1100" cy="650" r="200"/>
    <circle cx="100" cy="100" r="280"/>
    <circle cx="100" cy="100" r="220"/>
    <circle cx="100" cy="100" r="160"/>
  </g>

  <!-- Main Business Card Frame -->
  <rect x="50" y="45" width="1100" height="660" rx="28" fill="url(#bgGrad)" stroke="url(#cardBorder)" stroke-width="2.5" filter="url(#cardShadow)"/>

  <!-- Top Inner Accent Border -->
  <rect x="58" y="53" width="1084" height="644" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>

  <!-- National Flag Insignia / Seal Badge -->
  <g transform="translate(95, 88)">
    <circle cx="28" cy="28" r="28" fill="url(#redFlagGrad)" stroke="#D4AF37" stroke-width="1.8"/>
    <!-- Yellow 5-point star -->
    <path d="M 28 13 L 32.5 23 L 43 23 L 34.5 29.5 L 37.5 40 L 28 33.5 L 18.5 40 L 21.5 29.5 L 13 23 L 23.5 23 Z" fill="#FFE500"/>
  </g>

  <!-- Institutional Header -->
  <g transform="translate(170, 95)">
    <text font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#D4AF37" text-transform="uppercase">BỘ CÔNG THƯƠNG VIỆT NAM</text>
    <text y="26" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" letter-spacing="0.8" fill="#FFFFFF">CỤC XÚC TIẾN THƯƠNG MẠI · VIETRADE</text>
    <text y="46" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" fill="#94A3B8" text-transform="uppercase">VIETNAM TRADE PROMOTION AGENCY</text>
  </g>

  <!-- Status Chip Top Right -->
  <g transform="translate(860, 92)">
    <rect width="240" height="38" rx="19" fill="#1E3E62" fill-opacity="0.6" stroke="#D4AF37" stroke-width="1.2"/>
    <circle cx="20" cy="19" r="5" fill="#10B981"/>
    <text x="35" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#E2E8F0" text-transform="uppercase">TEI 2026 DELEGATION</text>
  </g>

  <!-- Divider Line -->
  <line x1="95" y1="180" x2="1055" y2="180" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- PIC Identity Section -->
  <g transform="translate(95, 235)">
    <!-- Small Category Eyebrow -->
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#D4AF37" text-transform="uppercase">OFFICIAL TRADE REPRESENTATIVE</text>
    <!-- Full Name -->
    <text y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="52" font-weight="800" letter-spacing="1.2" fill="#FFFFFF">TÂM TRANG</text>
    <!-- Official Roles -->
    <text y="88" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="600" fill="#F3C68F">Cán bộ Xúc tiến Thương mại · Trade Promotion Officer</text>
    <text y="116" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="500" fill="#94A3B8">Vietnam Trade Promotion Agency · Ministry of Industry and Trade (MOIT)</text>
  </g>

  <!-- Left: Official Contact Credentials Table -->
  <g transform="translate(95, 400)">
    <!-- Website & Email -->
    <g transform="translate(0, 0)">
      <circle cx="16" cy="16" r="16" fill="#162A45" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.4"/>
      <text x="16" y="21" font-family="sans-serif" font-size="14" fill="#D4AF37" text-anchor="middle">🌐</text>
      <text x="44" y="12" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="0.5">OFFICIAL PORTAL</text>
      <text x="44" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">www.vietrade.gov.vn</text>
    </g>

    <g transform="translate(320, 0)">
      <circle cx="16" cy="16" r="16" fill="#162A45" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.4"/>
      <text x="16" y="21" font-family="sans-serif" font-size="14" fill="#D4AF37" text-anchor="middle">✉</text>
      <text x="44" y="12" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="0.5">OFFICIAL EMAIL</text>
      <text x="44" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">tamtrang.vietrade@gmail.com</text>
    </g>

    <!-- Phone / WhatsApp / Zalo & Facebook -->
    <g transform="translate(0, 68)">
      <circle cx="16" cy="16" r="16" fill="#162A45" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.4"/>
      <text x="16" y="21" font-family="sans-serif" font-size="14" fill="#D4AF37" text-anchor="middle">📱</text>
      <text x="44" y="12" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="0.5">WHATSAPP · ZALO · MOBILE</text>
      <text x="44" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="800" fill="#38BDF8">+84 82 880 7986</text>
    </g>

    <g transform="translate(320, 68)">
      <circle cx="16" cy="16" r="16" fill="#162A45" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.4"/>
      <text x="16" y="21" font-family="sans-serif" font-size="14" fill="#D4AF37" text-anchor="middle">📘</text>
      <text x="44" y="12" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="0.5">FACEBOOK OFFICIAL</text>
      <text x="44" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">facebook.com/share/1EcwSiGKGU/</text>
    </g>

    <!-- Headquarters Address -->
    <g transform="translate(0, 136)">
      <circle cx="16" cy="16" r="16" fill="#162A45" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.4"/>
      <text x="16" y="21" font-family="sans-serif" font-size="14" fill="#D4AF37" text-anchor="middle">📍</text>
      <text x="44" y="12" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="0.5">HEADQUARTERS ADDRESS</text>
      <text x="44" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">Số 20 Lý Thường Kiệt, P. Phan Chu Trinh, Q. Hoàn Kiếm, TP. Hà Nội, Vietnam</text>
    </g>
  </g>

  <!-- Right: QR Code & NFC Tap Badge Box -->
  <g transform="translate(845, 230)">
    <rect width="255" height="340" rx="20" fill="#0A1C33" stroke="url(#cardBorder)" stroke-width="1.8"/>
    
    <!-- Gold Header Bar -->
    <rect x="0" y="0" width="255" height="42" rx="20" fill="url(#goldGrad)"/>
    <rect x="0" y="22" width="255" height="20" fill="url(#goldGrad)"/>
    <text x="127" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" letter-spacing="1.2" fill="#0A1424" text-anchor="middle" text-transform="uppercase">NFC SMART TOUCH CARD</text>

    <!-- QR Code Container -->
    <g transform="translate(37, 60)">
      <rect width="180" height="180" rx="14" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2"/>
      <image href="data:image/png;base64," x="10" y="10" width="160" height="160" />
    </g>

    <text x="127" y="270" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="0.8" fill="#F3C68F" text-anchor="middle">SCAN OR TAP CARD</text>
    <text x="127" y="290" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="middle">mycustomid.github.io/tangsel-tradelink</text>
    <text x="127" y="315" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" letter-spacing="1.2" fill="#38BDF8" text-anchor="middle" text-transform="uppercase">TÂM TRANG · VIETRADE</text>
  </g>

  <!-- Bottom Security Guilloche Bar -->
  <g transform="translate(95, 650)">
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="#64748B" text-transform="uppercase">AUTHENTIC DIGITAL ACCREDITATION · GOVERNMENT OF VIETNAM · TRADE EXPO INDONESIA 2026</text>
  </g>
</svg>