    <text y="166" fill="#c2593f" font-family="Georgia, serif" font-size="58" font-style="italic">from Home</text>
    <path d="M0 205h430" stroke="#1f1a18" stroke-width="2" opacity=".35"/>
    <text y="252" fill="#1f1a18" opacity=".65" font-family="Arial, sans-serif" font-size="19" letter-spacing="2">HONEST FLAVOUR / MADE CLOSE TO HOME</text>
  </g>
