      <text x="180" y="285" text-anchor="middle" fill="#c2593f" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="3">SAMARA</text>
      <text x="180" y="340" text-anchor="middle" fill="#1f1a18" font-family="Georgia, serif" font-size="34">Rawon</text>
      <text x="180" y="374" text-anchor="middle" fill="#1f1a18" font-family="Georgia, serif" font-size="22" font-style="italic">keluwek paste</text>
    </g>
