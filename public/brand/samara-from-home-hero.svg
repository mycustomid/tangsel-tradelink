<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">SAMARA from Home culinary editorial hero</title>
  <desc id="desc">Warm editorial still life with sauce jars, herbs, tomatoes, and a linen table.</desc>
  <defs>
    <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#f3eadf"/><stop offset="1" stop-color="#faf7f2"/></linearGradient>
    <filter id="grain"><feTurbulence baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .055"/></feComponentTransfer></filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#1f1a18" flood-opacity=".24"/></filter>
  </defs>
  <rect width="1200" height="1600" fill="url(#wall)"/>
  <rect width="1200" height="1600" filter="url(#grain)" opacity=".75"/>
  <circle cx="1000" cy="220" r="230" fill="#c2593f"/>
  <path d="M0 1080c240-90 388 72 626-9 219-75 358-27 574-126v655H0Z" fill="#4a5d3f"/>
  <path d="M70 1056c192 70 368-10 543 60 168 67 314 44 517-36v520H70Z" fill="#e7d8c5" opacity=".88"/>
