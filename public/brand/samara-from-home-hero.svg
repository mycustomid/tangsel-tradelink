      <text x="150" y="303" text-anchor="middle" fill="#1f1a18" font-family="Georgia, serif" font-size="32">Pesto</text>
      <text x="150" y="337" text-anchor="middle" fill="#1f1a18" font-family="Georgia, serif" font-size="20" font-style="italic">basil &amp; olive oil</text>
