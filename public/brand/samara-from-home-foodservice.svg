<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">SAMARA from home to food service</title>
  <desc id="desc">Editorial diagram connecting a home kitchen to cafe, restaurant, hotel, and catering.</desc>
  <rect width="1200" height="1200" fill="#faf7f2"/>
  <circle cx="1030" cy="170" r="230" fill="#c2593f" opacity=".94"/>
  <text x="70" y="86" fill="#4a5d3f" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="5">ONE SAUCE SYSTEM / TWO MARKETS</text>
  <text x="70" y="192" fill="#1f1a18" font-family="Georgia, serif" font-size="80">From a home</text>
  <text x="70" y="274" fill="#1f1a18" font-family="Georgia, serif" font-size="80" font-style="italic">ritual to service.</text>
  <g transform="translate(70 390)">
    <path d="M190 200C420 80 516 512 752 342s222 75 304 170" fill="none" stroke="#c2593f" stroke-width="5" stroke-dasharray="15 18"/>
    <g transform="translate(0 42)">
      <rect width="380" height="330" rx="28" fill="#4a5d3f"/>
      <path d="M88 244V126l102-72 102 72v118" fill="none" stroke="#faf7f2" stroke-width="8"/>
      <path d="M145 244v-72h90v72M128 112h124" fill="none" stroke="#faf7f2" stroke-width="8"/>
      <text x="190" y="298" text-anchor="middle" fill="#faf7f2" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">GOURMET HOME</text>
    </g>
    <g transform="translate(688 290)">
      <rect width="380" height="330" rx="28" fill="#1f1a18"/>
      <path d="M84 216h212M105 216l24-108h122l24 108M146 108V70h88v38" fill="none" stroke="#c2593f" stroke-width="8"/>
      <circle cx="190" cy="164" r="34" fill="#4a5d3f"/>
      <text x="190" y="288" text-anchor="middle" fill="#faf7f2" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">FOOD SERVICE</text>
    </g>
  </g>
  <g transform="translate(70 1016)" fill="#1f1a18" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">
