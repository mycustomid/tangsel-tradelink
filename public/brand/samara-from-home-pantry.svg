<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">SAMARA six flavour pantry</title>
  <desc id="desc">Editorial label system for six signature sauce directions.</desc>
  <rect width="1200" height="1200" fill="#1f1a18"/>
  <text x="72" y="84" fill="#c2593f" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="5">THE PANTRY / 01—06</text>
  <text x="72" y="180" fill="#faf7f2" font-family="Georgia, serif" font-size="74">Six routes to</text>
  <text x="72" y="254" fill="#faf7f2" font-family="Georgia, serif" font-size="74" font-style="italic">a better plate.</text>
  <g transform="translate(72 330)" font-family="Arial, sans-serif">
    <g><rect width="320" height="310" rx="160" fill="#4a5d3f"/><text x="160" y="132" text-anchor="middle" fill="#faf7f2" font-size="17" letter-spacing="3">01</text><text x="160" y="178" text-anchor="middle" fill="#faf7f2" font-family="Georgia, serif" font-size="34">Pesto</text><text x="160" y="216" text-anchor="middle" fill="#faf7f2" opacity=".65" font-size="15">BASIL / OLIVE OIL</text></g>
    <g transform="translate(352)"><rect width="320" height="310" rx="20" fill="#c2593f"/><text x="160" y="132" text-anchor="middle" fill="#faf7f2" font-size="17" letter-spacing="3">02</text><text x="160" y="178" text-anchor="middle" fill="#faf7f2" font-family="Georgia, serif" font-size="34">Chimichurri</text><text x="160" y="216" text-anchor="middle" fill="#faf7f2" opacity=".72" font-size="15">HERB / GARLIC</text></g>
    <g transform="translate(704)"><rect width="320" height="310" rx="160" fill="#352c28" stroke="#faf7f2" stroke-opacity=".2"/><text x="160" y="132" text-anchor="middle" fill="#c2593f" font-size="17" letter-spacing="3">03</text><text x="160" y="178" text-anchor="middle" fill="#faf7f2" font-family="Georgia, serif" font-size="34">Rawon</text><text x="160" y="216" text-anchor="middle" fill="#faf7f2" opacity=".65" font-size="15">KELUWEK / HERITAGE</text></g>
    <g transform="translate(0 342)"><rect width="320" height="310" rx="20" fill="#e7d8c5"/><text x="160" y="132" text-anchor="middle" fill="#c2593f" font-size="17" letter-spacing="3">04</text><text x="160" y="178" text-anchor="middle" fill="#1f1a18" font-family="Georgia, serif" font-size="34">Carbonara</text><text x="160" y="216" text-anchor="middle" fill="#1f1a18" opacity=".6" font-size="15">CREAMY / SAVOURY</text></g>
    <g transform="translate(352 342)"><rect width="320" height="310" rx="160" fill="#d59d52"/><text x="160" y="132" text-anchor="middle" fill="#1f1a18" font-size="17" letter-spacing="3">05</text><text x="160" y="178" text-anchor="middle" fill="#1f1a18" font-family="Georgia, serif" font-size="34">Pumpkin</text><text x="160" y="216" text-anchor="middle" fill="#1f1a18" opacity=".6" font-size="15">CHEESE / MELLOW</text></g>
    <g transform="translate(704 342)"><rect width="320" height="310" rx="20" fill="#8c2f28"/><text x="160" y="132" text-anchor="middle" fill="#faf7f2" font-size="17" letter-spacing="3">06</text><text x="160" y="178" text-anchor="middle" fill="#faf7f2" font-family="Georgia, serif" font-size="34">Chili Cheese</text><text x="160" y="216" text-anchor="middle" fill="#faf7f2" opacity=".68" font-size="15">HEAT / COMFORT</text></g>
  </g>
  <text x="72" y="1086" fill="#faf7f2" opacity=".6" font-family="Arial, sans-serif" font-size="18" letter-spacing="3">NO ADDED MSG · NO SYNTHETIC PRESERVATIVES</text>
</svg>
