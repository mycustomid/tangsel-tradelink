      <text y="132" fill="#c2593f" font-size="17" font-weight="700" letter-spacing="3">02</text><text x="70" y="132" fill="#0f291e" font-size="28">Ready meals</text><text x="70" y="162" fill="#0f291e" opacity=".55" font-size="17">rehydratable · compact · practical</text>
