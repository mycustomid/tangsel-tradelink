<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Lika Snack product context visual</title>
  <desc id="desc">Editorial visual inspired by verified public information about Lika Snack's crispy corn snacks and traditional snack range. This is not official packaging photography.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7e6"/>
      <stop offset="1" stop-color="#f1d192"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#5c2b13" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <g opacity=".28" stroke="#7c3517" stroke-width="2">
    <path d="M0 180H1200M0 360H1200M0 540H1200M0 720H1200"/>
    <path d="M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900"/>
  </g>
  <circle cx="930" cy="150" r="170" fill="#d96b2b" opacity=".18"/>
  <circle cx="250" cy="760" r="220" fill="#f6b93b" opacity=".22"/>
  <g transform="translate(690 170)" filter="url(#shadow)">
    <path d="M90 70C150 15 330 15 390 70L355 590C348 655 132 655 125 590Z" fill="#fffdf7" stroke="#5d2c18" stroke-width="8"/>
    <path d="M120 112H360" stroke="#5d2c18" stroke-width="8" stroke-linecap="round"/>
    <rect x="155" y="205" width="170" height="190" rx="26" fill="#c55323"/>
    <text x="240" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#fff7e6">LIKA</text>
    <text x="240" y="292" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#fff7e6">SNACK</text>
    <text x="240" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" letter-spacing="2" fill="#ffe4b2">PAMULANG</text>
    <g fill="#f0b63d" stroke="#bd7a16" stroke-width="2">
      <ellipse cx="175" cy="465" rx="30" ry="20" transform="rotate(-18 175 465)"/>
      <ellipse cx="225" cy="500" rx="34" ry="21" transform="rotate(14 225 500)"/>
      <ellipse cx="285" cy="468" rx="31" ry="19" transform="rotate(-8 285 468)"/>
      <ellipse cx="330" cy="520" rx="28" ry="18" transform="rotate(21 330 520)"/>
      <ellipse cx="190" cy="555" rx="32" ry="19" transform="rotate(9 190 555)"/>
      <ellipse cx="270" cy="555" rx="36" ry="20" transform="rotate(-15 270 555)"/>
    </g>
  </g>
  <g transform="translate(90 120)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="4" fill="#b44d22">PRODUCT CONTEXT / VERIFIED PUBLIC DATA</text>
    <text x="0" y="100" font-family="Georgia, serif" font-size="92" fill="#2d1c15">Jagung renyah,</text>
    <text x="0" y="186" font-family="Georgia, serif" font-size="92" font-style="italic" fill="#2d1c15">rasa yang luas.</text>
    <text x="0" y="252" font-family="Arial, sans-serif" font-size="24" fill="#624130">Emping jagung krispi · rengginang · slondok putih</text>
    <g transform="translate(0 330)" font-family="Arial, sans-serif">
      <rect width="470" height="220" rx="28" fill="#2d1c15"/>
      <text x="30" y="45" font-size="17" font-weight="700" letter-spacing="2" fill="#f6b93b">PUBLICLY DOCUMENTED FLAVOURS</text>
      <text x="30" y="95" font-size="31" fill="#fff7e6">Balado</text>
      <text x="30" y="137" font-size="31" fill="#fff7e6">Jagung bakar</text>
      <text x="30" y="179" font-size="31" fill="#fff7e6">Barbeque</text>
    </g>
    <text x="0" y="605" font-family="Arial, sans-serif" font-size="17" fill="#704a35">Bambu Apus · Pamulang · Tangerang Selatan</text>
    <text x="0" y="642" font-family="Arial, sans-serif" font-size="14" fill="#8b654d">Editorial context visual — not official packaging photography.</text>
  </g>
</svg>
